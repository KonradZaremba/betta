name: Release

# Fires when a version tag is pushed:
#   git tag v0.8.0 && git push origin v0.8.0
#
# Steps: build Release (which also produces the .yak + drop-in .zip via
# BuildYak=true) -> pack Betta.Abstractions, Betta.Preview, Betta.Generators,
# Betta.Templates and the Betta.Mcp dotnet tool and check the tag matches their version -> create a
# GitHub Release with those artifacts -> push all five to nuget.org via Trusted Publishing -> push the
# package to Yak / Rhino Package Manager (only if a YAK_TOKEN secret is set).
#
# nuget.org Trusted Publishing needs a policy on nuget.org (username menu >
# Trusted Publishing) for owner KonradZaremba, repository betta, workflow file
# release.yml. No API key is stored anywhere: NuGet/login exchanges GitHub's
# OIDC token for a one-hour key.
#
# NOTE: this workflow file must exist in the commit the tag points at — GitHub
# runs the version of the workflow present in the tagged ref. Keep it on any
# branch you cut releases from (main, develop/*).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # needed to create the GitHub Release
  id-token: write        # lets NuGet/login request a GitHub OIDC token for Trusted Publishing

jobs:
  release:
    runs-on: windows-latest        # yak.exe + net7.0-windows build require Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x

      - name: Build (Release + Yak package + drop-in zip)
        run: dotnet build Betta/Betta.sln -c Release -p:BuildYak=true

      - name: List built artifacts
        shell: pwsh
        run: Get-ChildItem artifacts -Recurse -Include *.zip,*.yak | Select-Object FullName, Length

      # Fails before anything is published if the tag and Directory.Build.props
      # disagree - nuget.org versions are immutable, so a wrong push can't be undone.
      - name: Pack NuGet packages and check tag matches version
        id: pack
        shell: pwsh
        run: |
          dotnet pack Betta.Abstractions/Betta.Abstractions.csproj -c Release --no-build
          dotnet pack Betta.Preview/Betta.Preview.csproj -c Release --no-build
          dotnet pack Betta.Generators/Betta.Generators.csproj -c Release
          dotnet pack templates/Betta.Templates/Betta.Templates.csproj -c Release
          dotnet pack Betta.Mcp/Betta.Mcp.csproj -c Release
          $version = "${{ github.ref_name }}".TrimStart('v')
          $expected = 'Betta.Abstractions', 'Betta.Preview', 'Betta.Generators', 'Betta.Templates', 'Betta.Mcp' |
                      ForEach-Object { "artifacts/$_.$version.nupkg" }
          $missing = @($expected | Where-Object { -not (Test-Path $_) })
          if ($missing) {
            $built = (Get-ChildItem artifacts/*.nupkg).Name -join ', '
            throw "Tag ${{ github.ref_name }} expects $($missing -join ', '), but pack produced: $built. Bump <Version> in Directory.Build.props to match the tag."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # Relative, forward-slash paths: gh expands asset arguments as globs on
          # Windows, and an absolute D:\... path makes it fail with "no matches found for `D`".
          $files = @(Get-ChildItem artifacts/Betta-*.zip, artifacts/yak/Betta-*-rh8_0-any.yak -ErrorAction SilentlyContinue |
                     ForEach-Object { (Resolve-Path -Relative $_.FullName).Replace('\', '/') })
          if (-not $files) { throw "No .zip/.yak artifacts found to attach — did BuildYak run?" }
          Write-Host "Attaching:`n$($files -join "`n")"
          gh release create $tag @files --title "Betta $tag" --generate-notes

      # Request the key right before pushing: it is valid for one hour and one use.
      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: konradzaremba     # nuget.org profile name (public package owner), not an email

      # One wildcard push (the pattern NuGet/login documents) so the single
      # short-lived key covers all five packages; .snupkg symbols ride along.
      # Backslash: on Windows NuGet expands the wildcard only in a \ path, and
      # artifacts/*.nupkg fails with "File does not exist" (broke the v0.8.0 run).
      - name: Publish NuGet packages to nuget.org
        shell: pwsh
        run: dotnet nuget push "artifacts\*.${{ steps.pack.outputs.version }}.nupkg" --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to Yak (Rhino Package Manager)
        env:
          YAK_TOKEN: ${{ secrets.YAK_TOKEN }}
        shell: pwsh
        run: |
          if (-not $env:YAK_TOKEN) {
            Write-Host "::warning::YAK_TOKEN secret not set - skipping Yak publish. Add it under repo Settings > Secrets and variables > Actions to enable automatic Package Manager updates."
            exit 0
          }
          $pkg = (Get-ChildItem artifacts/yak/Betta-*-rh8_0-any.yak -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          if (-not $pkg) {
            Write-Host "::warning::No .yak was built on this runner (building one needs Yak.exe from a Rhino install) - skipping Yak publish. Build and push it locally."
            exit 0
          }
          Invoke-WebRequest https://files.mcneel.com/yak/tools/latest/yak.exe -OutFile yak.exe
          Write-Host "Pushing $pkg to Yak..."
          ./yak.exe push $pkg

      - name: Food4Rhino note
        shell: pwsh
        run: |
          Write-Host "::notice::Food4Rhino has no publish API - update the listing manually at https://www.food4rhino.com (upload the .zip from this release). The Yak push above already updates Rhino's Package Manager, which is what the listing's 'Rhino Package' tab reflects."
